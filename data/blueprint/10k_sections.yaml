source_companies:
- nvidia
- apple
- microsoft
notes: 'Parsing rules for Form 10-K HTML. SEC item numbers are fixed (Regulation S-K):
  Item 8 = Financial Statements and Supplementary Data; Item 15 = Exhibits and Financial
  Statement Schedules. Primary statements (auditor report, income/operations, comprehensive
  income, balance sheet, equity, cash flows, notes) satisfy Item 8. Item 15(a)(1)
  is an index of those statements; supplemental schedules (e.g. Schedule II), when
  present, belong to Item 15. Detect ITEM section starts with header_patterns on real
  ITEM headings; ignore narrative cross-references (e.g. ''see Item 1A of this Form'').
  Item 6 is [Reserved] and not required. For statement hotspots: match header_patterns
  / compact_needles on statement titles—not on a fixed byte offset under an ITEM heading.
  If a TOC or index entry for a statement is an href with a #fragment, resolve that
  fragment and take the linked body (usually the HTML table); do not treat TOC page
  numbers as the payload. content=tables means table-aware extraction; content=narrative
  means prose. header_patterns include known title wordings (Operations vs Income,
  Stockholders vs Shareholders). compact_needles match text when HTML splits words
  across tags. source_companies lists filings used to harvest aliases_seen only.'
